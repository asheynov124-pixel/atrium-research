<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atrium</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Public+Sans:wght@380;480;560&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f4f1ea;
    --ink: #1c1a17;
    --muted: #6f675e;
    --rule: #e2dcd0;
    --accent: #8c3b24;
    --caution: #8a5a12;
    --neg: #8c2f2a;
    --ok: #2f5d45;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); }
  body { font-family: "Public Sans", sans-serif; font-weight: 380; }
  .bar {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 22px 48px 18px; border-bottom: 1px solid var(--rule);
  }
  .word { font-family: Newsreader, serif; font-size: 22px; letter-spacing: -0.03em; }
  .meta { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
  .sheet { max-width: 820px; margin: 0 auto; padding: 56px 28px 96px; }
  h1 {
    font-family: Newsreader, serif; font-weight: 500; font-size: 40px;
    letter-spacing: -0.03em; line-height: 1.15; margin: 0 0 12px;
  }
  .sub { color: var(--muted); font-size: 16px; line-height: 1.5; margin: 0 0 28px; max-width: 62ch; }
  form {
    display: flex; gap: 0; border-bottom: 1px solid var(--ink); margin-bottom: 8px;
  }
  input {
    flex: 1; border: 0; background: transparent; font: inherit; font-size: 18px;
    padding: 12px 0; outline: none; color: var(--ink);
  }
  button {
    border: 0; background: transparent; font: inherit; font-size: 14px;
    letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer; color: var(--accent);
  }
  .hint { color: var(--muted); font-size: 13px; margin: 10px 0 36px; }
  .hint button { text-transform: none; letter-spacing: 0; color: var(--ink); border-bottom: 1px solid var(--rule); padding: 0; margin-right: 14px; }
  .ruleline { font-family: Newsreader, serif; font-size: 22px; line-height: 1.45; margin: 8px 0 28px; }
  .auth { display: grid; grid-template-columns: 92px 1fr; gap: 18px; padding: 22px 0; border-top: 1px solid var(--rule); }
  .treat { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; padding-top: 4px; }
  .ok { color: var(--ok); } .caution { color: var(--caution); } .neg { color: var(--neg); }
  .name { font-weight: 560; }
  .cite { color: var(--muted); font-size: 14px; margin: 2px 0 10px; }
  q { font-family: Newsreader, serif; font-size: 18px; line-height: 1.5; display: block; margin: 0 0 8px; }
  .why { margin: 0; max-width: 68ch; line-height: 1.5; }
  .empty { border-top: 1px solid var(--rule); padding-top: 22px; color: var(--muted); }
  .foot { margin-top: 36px; color: var(--muted); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
</style>
</head>
<body>
<div class="bar">
  <div class="word">Atrium</div>
  <div class="meta">Federal · public opinions · desktop</div>
</div>
<div class="sheet">
  <h1>Ask a question the cases can answer.</h1>
  <p class="sub">This session holds eight Supreme Court opinions. It will not invent a holding. If the question is outside them, it says so.</p>
  <form id="f">
    <input id="q" placeholder="What must a plaintiff show to survive summary judgment?" autocomplete="off" />
    <button type="submit">Research</button>
  </form>
  <div class="hint" id="hints"></div>
  <div id="out"></div>
</div>
<script>
const corpus = [
  {
    id: "sj",
    keys: ["summary judgment", "rule 56", "celotex", "anderson", "scintilla", "burden"],
    title: "What a plaintiff must show to survive summary judgment",
    rule: "After adequate discovery, summary judgment is required if the party who bears the burden of proof cannot produce evidence on an essential element. A mere scintilla is not enough.",
    authorities: [
      { t: "Controls", c: "ok", name: "Celotex Corp. v. Catrett", cite: "477 U.S. 317, 322 (1986)", q: "Rule 56(c) mandates the entry of summary judgment, after adequate time for discovery and upon motion, against a party who fails to make a showing sufficient to establish the existence of an element essential to that party's case, and on which that party will bear the burden of proof at trial.", why: "The moving defendant does not have to disprove the claim. Pointing to the absence of evidence on an element the plaintiff must prove is enough to shift the burden." },
      { t: "Controls", c: "ok", name: "Anderson v. Liberty Lobby, Inc.", cite: "477 U.S. 242, 252 (1986)", q: "The mere existence of a scintilla of evidence in support of the plaintiff's position will be insufficient; there must be evidence on which the jury could reasonably find for the plaintiff.", why: "The question is the same as at trial: could a reasonable jury find for the nonmovant on the standard that applies to that claim." }
    ]
  },
  {
    id: "12b6",
    keys: ["motion to dismiss", "12(b)(6)", "plausib", "twombly", "iqbal", "complaint"],
    title: "What a complaint must plead to survive a motion to dismiss",
    rule: "A complaint must plead factual matter that, taken as true, states a claim plausible on its face. A conceivable claim is not enough.",
    authorities: [
      { t: "Controls", c: "ok", name: "Ashcroft v. Iqbal", cite: "556 U.S. 662, 678 (2009)", q: "To survive a motion to dismiss, a complaint must contain sufficient factual matter, accepted as true, to state a claim to relief that is plausible on its face.", why: "Threadbare recitals of elements and conclusory statements are set aside. The remaining facts must permit a reasonable inference of liability." },
      { t: "Controls", c: "ok", name: "Bell Atlantic Corp. v. Twombly", cite: "550 U.S. 544, 570 (2007)", q: "We do not require heightened fact pleading of specifics, but only enough facts to state a claim to relief that is plausible on its face.", why: "Iqbal took this antitrust pleading rule and applied it to civil complaints generally." }
    ]
  },
  {
    id: "pj",
    keys: ["personal jurisdiction", "specific jurisdiction", "minimum contacts", "ford", "bristol", "international shoe", "purposeful avail"],
    title: "When a state may hear a claim against an out-of-state defendant",
    rule: "Specific jurisdiction requires minimum contacts the defendant purposefully made with the forum, and a suit that arises out of or relates to those contacts.",
    authorities: [
      { t: "Foundation", c: "ok", name: "International Shoe Co. v. Washington", cite: "326 U.S. 310, 316 (1945)", q: "Due process requires only that in order to subject a defendant to a judgment in personam, if he be not present within the territory of the forum, he have certain minimum contacts with it such that the maintenance of the suit does not offend traditional notions of fair play and substantial justice.", why: "This is the modern test. Presence in the forum is not required." },
      { t: "Controls", c: "ok", name: "Ford Motor Co. v. Montana Eighth Judicial District Court", cite: "141 S. Ct. 1017, 1026 (2021)", q: "The plaintiff's claims must arise out of or relate to the defendant's contacts with the forum.", why: "Relatedness does not require that the particular product have been designed, made, or first sold in the forum, if the defendant systematically serves that market and the injury occurred there." },
      { t: "Limit", c: "caution", name: "Bristol-Myers Squibb Co. v. Superior Court", cite: "137 S. Ct. 1773, 1781 (2017)", q: "What is needed—and what is missing here—is a connection between the forum and the specific claims at issue.", why: "Nonresidents who were not prescribed the drug in the forum, and were not injured there, cannot borrow the forum contacts of other plaintiffs." }
    ]
  },
  {
    id: "chevron",
    keys: ["chevron", "deference", "agency", "loper", "raimondo"],
    title: "Does Chevron deference still control",
    rule: "No. The Court overruled Chevron. Courts interpret the statute themselves.",
    authorities: [
      { t: "Overruled", c: "neg", name: "Chevron U.S.A. Inc. v. Natural Resources Defense Council", cite: "467 U.S. 837 (1984)", q: "If the statute is silent or ambiguous with respect to the specific issue, the question for the court is whether the agency's answer is based on a permissible construction of the statute.", why: "This was the rule. It is no longer good law. Do not cite it as controlling." },
      { t: "Controls", c: "ok", name: "Loper Bright Enterprises v. Raimondo", cite: "144 S. Ct. 2244 (2024)", q: "Chevron is overruled. Courts must exercise independent judgment in deciding whether an agency has acted within its statutory authority.", why: "The holding is the reason the older case carries a negative signal. Quote Loper Bright, not Chevron, for the current rule." }
    ]
  }
];
const hints = [
  "What must a plaintiff show to survive summary judgment?",
  "What does a complaint need to survive a motion to dismiss?",
  "When can a state hear a claim against an out-of-state company?",
  "Is Chevron deference still good law?"
];
document.getElementById("hints").innerHTML = hints.map(h => `<button type="button" data-q="${h}">${h}</button>`).join("");
document.getElementById("hints").onclick = (e) => {
  if (e.target.dataset.q) { document.getElementById("q").value = e.target.dataset.q; run(); }
};
document.getElementById("f").onsubmit = (e) => { e.preventDefault(); run(); };
function run() {
  const q = document.getElementById("q").value.toLowerCase();
  const hit = corpus.find(c => c.keys.some(k => q.includes(k))) || (q.includes("judgment") ? corpus[0] : null);
  const out = document.getElementById("out");
  if (!hit) {
    out.innerHTML = `<div class="empty"><p>Not in this session. Atrium will not draft an answer from outside these opinions.</p><p>This desk can answer summary judgment, motions to dismiss, specific personal jurisdiction, and whether Chevron is still good law.</p></div>`;
    return;
  }
  out.innerHTML = `<p class="ruleline">${hit.rule}</p>` + hit.authorities.map(a => `
    <article class="auth">
      <div class="treat ${a.c}">${a.t}</div>
      <div>
        <div class="name">${a.name}</div>
        <div class="cite">${a.cite}</div>
        <q>${a.q}</q>
        <p class="why">${a.why}</p>
      </div>
    </article>`).join("") + `<div class="foot">Quoted from the public opinion · not a citator subscription</div>`;
}
</script>
</body>
</html>
