<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Atrium</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,480;6..72,560&family=Outfit:wght@340;480;560&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#0e0e0c; --panel:#171714; --ink:#f3efe6; --muted:#9c9488; --line:rgba(243,239,230,.12); --copper:#c9845a; --ok:#8fbfa3; --warn:#e0b15a; --bad:#e08b82; }
  * { box-sizing:border-box; } body { margin:0; background:var(--bg); color:var(--ink); font-family:Outfit,sans-serif; font-weight:340; }
  header { position:sticky; top:0; z-index:3; display:flex; gap:16px; align-items:center; padding:14px 20px; background:rgba(14,14,12,.92); border-bottom:1px solid var(--line); backdrop-filter:blur(10px); }
  .logo { font-family:Newsreader,serif; font-size:22px; } form { flex:1; display:flex; } input { width:100%; background:#11110f; color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:12px 16px; font:inherit; font-size:15px; outline:none; } input:focus { border-color:var(--copper); }
  .layout { display:grid; grid-template-columns:240px 1fr 300px; min-height:calc(100vh - 62px); }
  aside, .side { border-right:1px solid var(--line); padding:18px; } .side { border-right:0; border-left:1px solid var(--line); }
  h2 { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); font-weight:560; margin:18px 0 8px; }
  button.issue, button.link { display:block; width:100%; text-align:left; background:transparent; color:var(--ink); border:0; border-bottom:1px solid var(--line); padding:10px 0; font:inherit; cursor:pointer; }
  main { padding:28px 32px 64px; } .kicker { color:var(--copper); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
  h1 { font-family:Newsreader,serif; font-weight:480; font-size:34px; letter-spacing:-.03em; margin:8px 0 12px; }
  .rule { font-size:18px; line-height:1.45; max-width:62ch; }
  .card { margin-top:18px; padding:16px 0; border-top:1px solid var(--line); display:grid; grid-template-columns:88px 1fr; gap:12px; }
  .sig { font-size:12px; letter-spacing:.06em; text-transform:uppercase; } .ok{color:var(--ok)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  q { font-family:Newsreader,serif; font-size:18px; line-height:1.45; display:block; }
  .why { color:var(--muted); margin:8px 0 0; }
  .map { display:flex; gap:8px; flex-wrap:wrap; } .map span { border:1px solid var(--line); border-radius:999px; padding:6px 10px; font-size:12px; color:var(--muted); }
  .note { color:var(--muted); font-size:13px; line-height:1.45; }
  @media (max-width:900px) { .layout{grid-template-columns:1fr} aside,.side{border:0} header{flex-wrap:wrap} .logo{width:100%} }
</style>
</head>
<body>
<header>
  <div class="logo">Atrium</div>
  <form id="f"><input id="q" placeholder="Search the session — summary judgment, dismissal, jurisdiction, Chevron" /></form>
</header>
<div class="layout">
  <aside>
    <h2>Issue index</h2>
    <div id="issues"></div>
    <h2>This session</h2>
    <div id="trail" class="note">Nothing opened yet.</div>
  </aside>
  <main id="main"></main>
  <aside class="side" id="side"></aside>
</div>
<script>
const issues = [
  { id:"sj", label:"Summary judgment", keys:["summary judgment","rule 56","celotex","anderson","burden of proof","scintilla"], title:"What the movant must show under Rule 56", rule:"The party who does not bear the trial burden can win by pointing to the absence of evidence on an essential element. A scintilla in response is not enough.", auths:[
    { s:"Followed", c:"ok", name:"Celotex Corp. v. Catrett", cite:"477 U.S. 317, 322 (1986)", q:"Rule 56(c) mandates the entry of summary judgment, after adequate time for discovery and upon motion, against a party who fails to make a showing sufficient to establish the existence of an element essential to that party's case, and on which that party will bear the burden of proof at trial.", why:"Use this for the opening burden. Do not write that the defendant must disprove the claim." },
    { s:"Followed", c:"ok", name:"Anderson v. Liberty Lobby, Inc.", cite:"477 U.S. 242, 252 (1986)", q:"The mere existence of a scintilla of evidence in support of the plaintiff's position will be insufficient; there must be evidence on which the jury could reasonably find for the plaintiff.", why:"Use this for the response. The standard mirrors the directed-verdict test." }
  ], use:"Move first on the missing element. Answer only with evidence a jury could credit.", verify:"A sentence that says the movant must negate the claim is not supported." },
  { id:"12b", label:"Motion to dismiss", keys:["motion to dismiss","12(b)(6)","plausib","twombly","iqbal","complaint"], title:"What a complaint must contain", rule:"Facts taken as true must state a claim plausible on its face. Conceivable is not the test.", auths:[
    { s:"Followed", c:"ok", name:"Ashcroft v. Iqbal", cite:"556 U.S. 662, 678 (2009)", q:"To survive a motion to dismiss, a complaint must contain sufficient factual matter, accepted as true, to state a claim to relief that is plausible on its face.", why:"Conclusory allegations are set aside before the plausibility reading." },
    { s:"Followed", c:"ok", name:"Bell Atlantic Corp. v. Twombly", cite:"550 U.S. 544, 570 (2007)", q:"We do not require heightened fact pleading of specifics, but only enough facts to state a claim to relief that is plausible on its face.", why:"Iqbal applied this beyond antitrust." }
  ], use:"Identify the element, then the pleaded fact that makes liability plausible.", verify:"Do not cite Twombly for a summary-judgment burden." },
  { id:"pj", label:"Specific jurisdiction", keys:["personal jurisdiction","specific jurisdiction","minimum contacts","ford","bristol","international shoe"], title:"When the forum may hear the claim", rule:"The defendant must have purposeful forum contacts, and the claim must arise out of or relate to them.", auths:[
    { s:"Foundation", c:"ok", name:"International Shoe Co. v. Washington", cite:"326 U.S. 310, 316 (1945)", q:"Due process requires only that in order to subject a defendant to a judgment in personam, if he be not present within the territory of the forum, he have certain minimum contacts with it such that the maintenance of the suit does not offend traditional notions of fair play and substantial justice.", why:"Presence is not required." },
    { s:"Followed", c:"ok", name:"Ford Motor Co. v. Montana Eighth Judicial District Court", cite:"141 S. Ct. 1017, 1026 (2021)", q:"The plaintiff's claims must arise out of or relate to the defendant's contacts with the forum.", why:"A strict causal chain from the particular unit is not required if the defendant serves that market and the injury is there." },
    { s:"Limited", c:"warn", name:"Bristol-Myers Squibb Co. v. Superior Court", cite:"137 S. Ct. 1773, 1781 (2017)", q:"What is needed—and what is missing here—is a connection between the forum and the specific claims at issue.", why:"Nonresident plaintiffs cannot borrow another plaintiff's forum injury." }
  ], use:"Separate the defendant's own contacts from the plaintiff's residence.", verify:"Do not cite Ford for a nonresident who was not injured in the forum." },
  { id:"ch", label:"Agency deference", keys:["chevron","deference","agency","loper","raimondo"], title:"Chevron is not good law", rule:"Courts interpret the statute. Chevron deference has been overruled.", auths:[
    { s:"Overruled", c:"bad", name:"Chevron U.S.A. Inc. v. NRDC", cite:"467 U.S. 837 (1984)", q:"If the statute is silent or ambiguous with respect to the specific issue, the question for the court is whether the agency's answer is based on a permissible construction of the statute.", why:"This sentence is the old rule. Do not cite it as controlling." },
    { s:"Controls", c:"ok", name:"Loper Bright Enterprises v. Raimondo", cite:"144 S. Ct. 2244 (2024)", q:"Chevron is overruled. Courts must exercise independent judgment in deciding whether an agency has acted within its statutory authority.", why:"This is the overruling-risk case for anything that rested on Chevron." }
  ], use:"Cite Loper Bright for the current rule. Mention Chevron only as overruled.", verify:"A cite to Chevron as good law fails the check." }
];
const trail = [];
function renderIssues(){ document.getElementById("issues").innerHTML = issues.map(i=>`<button class="issue" data-id="${i.id}">${i.label}</button>`).join(""); }
function show(issue){
  trail.unshift(issue.label); document.getElementById("trail").textContent = trail.slice(0,4).join(" · ");
  document.getElementById("main").innerHTML = `<div class="kicker">${issue.label}</div><h1>${issue.title}</h1><p class="rule">${issue.rule}</p>` +
    issue.auths.map(a=>`<article class="card"><div class="sig ${a.c}">${a.s}</div><div><strong>${a.name}</strong><div class="note">${a.cite}</div><q>${a.q}</q><p class="why">${a.why}</p></div></article>`).join("");
  document.getElementById("side").innerHTML = `<h2>How to use it</h2><p class="note">${issue.use}</p><h2>Verify</h2><p class="note">${issue.verify}</p><h2>Relationship</h2><div class="map">${issue.auths.map(a=>`<span>${a.name.split(" v. ")[0]}</span>`).join("")}</div><h2>Not in this session</h2><p class="note">No judge analytics, no news file, no docket. Those stay blank rather than invented.</p>`;
}
function run(q){
  const s = q.toLowerCase();
  const hit = issues.find(i => i.keys.some(k => s.includes(k)));
  if (!hit) {
    document.getElementById("main").innerHTML = `<h1>Not in this session.</h1><p class="rule">Atrium will not answer from outside these opinions. Try summary judgment, a motion to dismiss, specific jurisdiction, or Chevron.</p>`;
    document.getElementById("side").innerHTML = "";
    return;
  }
  show(hit);
}
document.getElementById("issues").onclick = e => { const id=e.target.dataset.id; if(id) show(issues.find(i=>i.id===id)); };
document.getElementById("f").onsubmit = e => { e.preventDefault(); run(document.getElementById("q").value); };
renderIssues(); show(issues[0]);
</script>
</body>
</html>
